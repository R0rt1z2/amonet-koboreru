name: Close LLM generated issues and pull requests

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const pr = !!context.payload.pull_request;
            const { owner, repo } = context.repo;
            const number = item.number;

            if (item.state === 'closed')
              return;
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(item.author_association))
              return;

            const fingerprint = /5L0P-F1NG3RPR1NT/i;
            const tag = /^\s*SLOPWARE\b/i;

            let slop = tag.test(item.title) || fingerprint.test(item.body || '');

            if (!slop && pr) {
              const files = await github.paginate(github.rest.pulls.listFiles,
                { owner, repo, pull_number: number });
              slop = files.some(f => f.filename !== 'AGENTS.md' && fingerprint.test(f.patch || ''));
            }

            if (!slop && pr) {
              const commits = await github.paginate(github.rest.pulls.listCommits,
                { owner, repo, pull_number: number });
              slop = commits.some(c => tag.test(c.commit.message) || fingerprint.test(c.commit.message));
            }

            if (!slop)
              return;

            await github.rest.issues.createComment({ owner, repo, issue_number: number,
              body: 'This is marked as generated by an LLM (see AGENTS.md), so it is closed without review.' });
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['slop'] });

            if (pr)
              await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
            else
              await github.rest.issues.update({ owner, repo, issue_number: number,
                state: 'closed', state_reason: 'not_planned' });

            await github.rest.issues.lock({ owner, repo, issue_number: number, lock_reason: 'spam' });
